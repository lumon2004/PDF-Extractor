[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-page-extractor"
version = "0.1.0"
description = "Interactive command-line tool for extracting selected pages from PDF files"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pypdf>=6.12,<7"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: 3.9",
    "Programming Language :: Python :: 3 :: 3.10",
    "Programming Language :: Python :: 3 :: 3.11",
    "Programming Language :: Python :: 3 :: 3.12",
    "Programming Language :: Python :: 3 :: 3.13",
]

[project.urls]
Homepage = "https://github.com/lumon2004/PDF-Extractor"
Repository = "https://github.com/lumon2004/PDF-Extractor"
Issues = "https://github.com/lumon2004/PDF-Extractor/issues"

[project.scripts]
pdf-extractor = "pdf_extractor:main"

[tool.setuptools]
py-modules = ["pdf_extractor"]
